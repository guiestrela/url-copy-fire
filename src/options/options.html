<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="color-scheme" content="light dark"><link rel="stylesheet" href="options.css"><title>URL Route - Options</title></head>
<body>
  <header class="top"><img src="../../icons/icon48.png" alt="" class="logo"><div><h1>URL Route</h1><div class="sub" id="theme-badge">Detecting theme...</div></div></header>
  <section class="card"><h2>Theme</h2><div class="field"><label>Mode</label><select id="theme-mode"><option value="auto">Follow system</option><option value="light">Light</option><option value="dark">Dark</option></select><p class="hint" id="theme-hint"></p></div></section>
  <section class="card"><h2>Output format</h2><div class="field"><label>Text type</label><select id="text-type"><option value="json">JSON</option><option value="text">Plain text</option><option value="markdown">Markdown</option></select></div></section>
  <section class="card"><h2>Share History</h2><ul id="history-list"></ul><div class="empty" id="history-empty">No records yet.</div><button class="link" id="clear-history">Clear history</button></section>
  <p class="hint">Actions are saved to <code>storage.local</code>.</p>
  <script src="options.js"></script>
</body>
</html>
